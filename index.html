        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap');
        .lottery-root {
          --ink:#0E1116; --panel:#171B23; --panel-2:#1D2330; --line:#2A3040;
          --amber:#FFB020; --red:#FF4B4B; --paper:#F4F6FA; --muted:#8A93A6; --green:#34D399;
          font-family:'Manrope',system-ui,-apple-system,sans-serif;
          background:radial-gradient(120% 140% at 50% -10%, #1a2130 0%, var(--ink) 55%);
          color:var(--paper); border-radius:16px; padding:20px; min-height:560px;
          box-sizing:border-box; position:relative; overflow:hidden;
        }
        .lottery-root *{box-sizing:border-box;}
        .lr-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
        .lr-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;letter-spacing:.3px;margin:0;text-transform:uppercase;}
        .lr-title span{color:var(--amber);}
        .lr-tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;}
        .lr-tab{border:none;background:transparent;color:var(--muted);font-family:'Manrope',sans-serif;font-weight:600;font-size:13px;padding:7px 13px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;}
        .lr-tab.active{background:var(--amber);color:#221604;}
        .lr-tab:not(.active):hover{color:var(--paper);}

        .lr-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;}

        .lr-mode-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;}
        .lr-mode-label{font-size:12px;color:var(--muted);font-weight:600;}
        .lr-row-head{display:grid;grid-template-columns:42px 1fr 92px 30px;gap:10px;padding:0 6px 8px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;border-bottom:1px solid var(--line);margin-bottom:6px;}
        .lr-team-list{max-height:430px;overflow-y:auto;padding-right:4px;}
        .lr-team-row{display:grid;grid-template-columns:42px 1fr 92px 30px;gap:10px;align-items:center;padding:6px;border-radius:8px;}
        .lr-team-row:hover{background:var(--panel-2);}

        .lr-logo-cell{position:relative;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:visible;border:2px solid var(--line);}
        .lr-logo-cell:hover{border-color:var(--amber);}
        .lr-logo-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;}
        .lr-logo-inner img{width:100%;height:100%;object-fit:contain;}
        .lr-logo-initials{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:12px;color:#14120c;}
        .lr-logo-add{position:absolute;bottom:-3px;right:-3px;background:var(--panel-2);border:1px solid var(--line);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
        .lr-logo-cell:hover .lr-logo-add{color:var(--amber);border-color:var(--amber);}
        .lr-logo-del{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}

        .lr-input{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);border-radius:7px;padding:7px 9px;font-family:'Manrope',sans-serif;font-size:13.5px;width:100%;}
        .lr-input:focus{outline:none;border-color:var(--amber);}
        .lr-weight-wrap{display:flex;flex-direction:column;gap:2px;}
        .lr-pct{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:2px;}
        .lr-remove{background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;padding:5px;}
        .lr-remove:hover{color:var(--red);background:rgba(255,75,75,.1);}
        .lr-remove:disabled{opacity:.35;cursor:not-allowed;}

        .lr-add{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px dashed var(--line);color:var(--paper);border-radius:9px;padding:10px 14px;font-family:'Manrope',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;width:100%;justify-content:center;}
        .lr-add:hover{border-color:var(--amber);color:var(--amber);}
        .lr-add:disabled{opacity:.4;cursor:not-allowed;}

        .lr-footer-note{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--muted);}
        .lr-footer-note.error{color:var(--red);}

        .lr-draw-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
        .lr-select{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:7px 10px;font-family:'Manrope',sans-serif;font-size:13px;}
        .lr-btn{display:inline-flex;align-items:center;gap:7px;background:var(--amber);color:#221604;border:none;border-radius:9px;padding:10px 18px;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:filter .15s,transform .1s;}
        .lr-btn:hover{filter:brightness(1.08);} .lr-btn:active{transform:scale(.98);}
        .lr-btn:disabled{opacity:.45;cursor:not-allowed;}
        .lr-btn.secondary{background:var(--panel-2);color:var(--paper);border:1px solid var(--line);}
        .lr-btn:focus-visible{outline:2px solid var(--paper);outline-offset:2px;}

        .lr-status-line{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums;}
        .lr-status-line.done{color:var(--amber);}
        .lr-hint{text-align:center;font-size:11px;color:var(--muted);opacity:.75;margin-bottom:16px;}

        .lr-ball-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:13px;margin-bottom:22px;}
        .lr-ball{position:relative;aspect-ratio:1/1;border-radius:50%;background:var(--panel-2);border:2px solid var(--line);perspective:170px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;}
        .lr-ball-3d{position:absolute;inset:0;transform-style:preserve-3d;animation-timing-function:linear;animation-iteration-count:1;animation-fill-mode:forwards;}
        .lr-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;backface-visibility:hidden;transform:translateZ(15px);text-shadow:0 1px 3px rgba(0,0,0,.6);}
        .lr-ball-gloss{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:3;
          background:radial-gradient(circle at 33% 25%,rgba(255,255,255,.30),rgba(255,255,255,0) 42%),radial-gradient(circle at 50% 118%,rgba(0,0,0,.45),rgba(0,0,0,0) 55%);
          box-shadow:inset 0 -8px 13px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.10);}
        .lr-ball-static{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:24px;line-height:1;color:var(--muted);opacity:.5;}
        .lr-ball-logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;line-height:1;color:#14120c;text-shadow:0 1px 2px rgba(255,255,255,.4);}
        /* Etichetta bianca al centro della palla: garantisce che il logo si legga
           qualunque sia il colore della squadra. */
        .lr-ball-sticker{position:absolute;top:14%;left:14%;width:72%;height:72%;border-radius:50%;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;z-index:2;}
        .lr-ball-sticker img{width:86%;height:86%;object-fit:contain;}
        .lr-ball-active{transform:scale(1.16);border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,176,32,.18),0 0 20px rgba(255,176,32,.4);z-index:2;}
        .lr-ball-next{border-color:rgba(255,176,32,.5);box-shadow:0 0 0 3px rgba(255,176,32,.12);}
        .lr-ball-revealed{border-color:rgba(255,255,255,.28);animation:lr-ball-pop .4s ease;}
        .lr-ball-winner{box-shadow:0 0 0 3px var(--amber),0 0 24px rgba(255,176,32,.55);}
        .lr-ball-tag{position:absolute;bottom:-6px;right:-3px;background:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:9px;padding:1px 4px;color:var(--muted);font-variant-numeric:tabular-nums;z-index:4;}
        .lr-ball-crown{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:15px;z-index:4;}

        @keyframes lr-spin-slow{
          0%{transform:rotateX(0deg);animation-timing-function:linear;}
          60%{transform:rotateX(-1080deg);animation-timing-function:cubic-bezier(.2,.72,.3,1);}
          100%{transform:rotateX(-1440deg);} }
        @keyframes lr-spin-normal{
          0%{transform:rotateX(0deg);animation-timing-function:linear;}

        @keyframes lr-spin-fast{

        @media (prefers-reduced-motion:reduce){.lr-ball-3d{animation:none;}.lr-ball-revealed{animation:none;}}

        .lr-recap{display:flex;flex-direction:column;gap:5px;}
        .lr-recap-row{display:grid;grid-template-columns:34px 1fr 60px;align-items:center;gap:10px;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;transition:opacity .3s ease;}
        .lr-recap-row.pending{opacity:.36;}
        .lr-pick-num{font-family:'Oswald',sans-serif;font-size:14px;color:var(--amber);text-align:center;}
        .lr-recap-team{display:flex;align-items:center;gap:9px;min-width:0;}
        .lr-mini{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#14120c;overflow:hidden;font-family:'Oswald',sans-serif;}
        .lr-mini img{width:100%;height:100%;object-fit:contain;background:#fff;}
        .lr-recap-info{display:flex;flex-direction:column;min-width:0;}
        .lr-recap-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .lr-recap-sub{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}
        .lr-delta{display:flex;align-items:center;gap:3px;justify-content:flex-end;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
        .lr-delta.up{color:var(--green);} .lr-delta.down{color:var(--red);} .lr-delta.same{color:var(--muted);}

        .lr-sim-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
        .lr-bar{height:6px;background:var(--panel-2);border-radius:100px;overflow:hidden;margin-bottom:14px;}
        .lr-bar span{display:block;height:100%;background:var(--amber);transition:width .1s linear;}
        .lr-sim-note{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5;}
        .lr-sim-head-row{display:grid;grid-template-columns:1fr 46px 52px 46px 42px 46px;gap:8px;font-size:10px;color:var(--muted);font-weight:700;padding:0 8px 6px;border-bottom:1px solid var(--line);}
        .lr-sim-row{display:grid;grid-template-columns:1fr 46px 52px 46px 42px 46px;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums;}
        .lr-sim-row:last-child{border-bottom:none;}
        .lr-sim-name{display:flex;align-items:center;gap:7px;min-width:0;}

        .lr-num-right{text-align:right;}

        .rc-stadium{position:relative;display:flex;background:#4E9622;border-radius:8px;padding:6px 0;overflow:hidden;}
        .rc-ez{width:34px;flex-shrink:0;align-self:stretch;margin:6px 0;}
        .rc-ez-left{background:linear-gradient(202deg,#E8272C 0 45%,#FFFFFF 45% 52%,#3B9EE0 52% 100%);border-right:3px solid #fff;}
        .rc-ez-right{background:linear-gradient(158deg,#3B9EE0 0 45%,#FFFFFF 45% 52%,#E8272C 52% 100%);border-left:3px solid #fff;}
        /* --- livrea basket: parquet, area verniciata e canestro --- */
        .rc-basket{background:#8E5B27;}
        /* parquet: doghe orizzontali con tacche sfalsate, come nel campo vero */
        .rc-basket .rc-field{
          background-image:
            repeating-linear-gradient(0deg,rgba(120,70,25,.22) 0 1px,transparent 1px 11px),
            repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 46px,rgba(0,0,0,.05) 46px 92px),
            linear-gradient(180deg,#D79C56,#C2863F);
          border:none;}
        .rc-basket .rc-hash{display:none;}
        .rc-basket .rc-yardnum{display:none;}
        /* niente end zone: nel basket si corre da canestro a canestro, quindi la
           pista occupa tutta la larghezza del campo */
        .rc-basket .rc-ez{display:none;}
        .rc-basket .rc-runners{left:10px;right:10px;}
        .rc-court{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
        /* Palla: sei quote di rimbalzo agganciate ai fotogrammi della falcata,
           quindi il palleggio accelera insieme al giocatore invece di andare a
           ritmo fisso. Sta fuori dalla mappa dello sprite perch\xE9 dovendo
           scendere fino al parquet si confonderebbe con le gambe. */
        /* Il cuoco: leggermente pi\xF9 grande dei corridori e con una transizione
           verticale, cos\xEC lo si vede spostarsi sulla corsia del prossimo bersaglio. */
        /* --- campo infinito che scorre sotto i corridori --- */
        .rc-endless{position:relative;overflow:hidden;border-radius:10px;
          background-image:
            repeating-linear-gradient(0deg,rgba(120,70,25,.26) 0 1px,transparent 1px 11px),
            repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 46px,rgba(0,0,0,.09) 46px 92px),
            linear-gradient(180deg,#D79C56,#BE8038);
          background-size:100% 100%,92px 100%,100% 100%;
          animation:rc-scroll 1.05s linear infinite;}
        @keyframes rc-scroll{
          from{background-position:0 0,0 0,0 0;}
          to{background-position:0 0,-92px 0,0 0;}}
        .rc-side{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.85);z-index:2;}
        .rc-side-top{top:7px;} .rc-side-bot{bottom:7px;}
        .rc-endless-runner{top:0;}
        .rc-endless .rc-chef{top:0;margin-top:20px;transition:top .62s ease-in-out;}
        .rc-fd0,.rc-fd1{opacity:0;}
        .rc-stopped{animation-play-state:paused;}
        .rc-chef[data-f="front"] .rc-ffront{opacity:1;}
        /* nuvoletta di dialogo: cornice spessa, testo a comparsa e freccina
           lampeggiante in basso a destra */
        .rc-dialog{position:absolute;left:14px;right:14px;bottom:12px;z-index:9;
          background:#F7F2E4;border:4px solid #2A2A32;border-radius:10px;
          box-shadow:inset 0 0 0 3px #F7F2E4, 0 5px 0 rgba(0,0,0,.35);
          padding:13px 16px;min-height:46px;}
        .rc-dialog-txt{font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.5px;
          color:#22222A;line-height:1.35;}
        .rc-dialog::after{content:"\u25BC";position:absolute;right:12px;bottom:6px;
          font-size:11px;color:#22222A;animation:rc-blink .9s steps(2,start) infinite;}
        @keyframes rc-blink{0%,49%{opacity:1}50%,100%{opacity:0}}

        .rc-runner[data-f="d0"] .rc-fd0,.rc-runner[data-f="d1"] .rc-fd1{opacity:1;}

        .rc-hash{position:absolute;left:0;right:0;height:5px;pointer-events:none;

<script>
/* Deterministic lottery contract used by Corsa and Verifica.  Keep this small
   public copy beside the bundle so integrations can exercise the exact same
   seed semantics without depending on React internals. */
(() => {
  const normalizeLotterySeed = value => {
    const seed = Number(value);
    return Number.isInteger(seed) && seed >= 1 && seed <= 1000 ? seed : null;
  };
  const lotteryPrng = seed => {
    let state = seed >>> 0;
    return () => {
      state = (state + 1831565813) | 0;
      const value = Math.imul(state ^ (state >>> 15), 1 | state);
      return ((value + Math.imul(value ^ (value >>> 7), 61 | value) ^ value ^ (value >>> 14)) >>> 0) / 4294967296;
    };
  };
  const lotteryWeight = value => {
    const weight = Number(value);
    return Number.isFinite(weight) && weight > 0 ? weight : 0;
  };
  const seededWeightedOrder = (teams, mode = "first", seed = 1) => {
    const normalized = normalizeLotterySeed(seed);
    if (normalized === null || !Array.isArray(teams)) return null;
    const remaining = teams.map(team => ({ team, weight: lotteryWeight(team.weight) }));
    if (remaining.every(item => item.weight === 0)) return null;
    const random = lotteryPrng(normalized);
    const order = [];
    while (remaining.length) {
      const total = remaining.reduce((sum, item) => sum + item.weight, 0);
      if (total <= 0) return null;
      let cursor = random() * total;
      let index = 0;
      while (index < remaining.length - 1 && (cursor -= remaining[index].weight) >= 0) index++;
      order.push(remaining.splice(index, 1)[0].team);
    }
    return mode === "last" ? order.reverse() : order;
  };
  window.normalizeLotterySeed = normalizeLotterySeed;
  window.seededWeightedOrder = seededWeightedOrder;
  window.lotteryPrng = lotteryPrng;

  const patchUi = () => {
    const root = document.querySelector(".lottery-root");
    if (!root) return;
    const weights = [...root.querySelectorAll('.lr-weight-wrap input[type="number"]')];
    const hasWeightInputs = weights.length > 0;
    const validWeights = !hasWeightInputs || weights.some(input => lotteryWeight(input.value) > 0);
    root.querySelectorAll("button").forEach(button => {
      if (/Avvia sorteggio|^Basket$|^Fuga dal cuoco!?$/.test(button.textContent.trim())) {
        button.disabled = hasWeightInputs && (!validWeights || weights.length < 2);
      }
    });
    if (hasWeightInputs && !validWeights && weights.length >= 2 && root.querySelector(".lr-tab.active")?.textContent === "Corsa") {
      const note = root.querySelector(".lr-zero-weight-error") || document.createElement("div");
      note.className = "lr-footer-note error lr-zero-weight-error";
      note.textContent = "Inserisci almeno un peso maggiore di zero per avviare la corsa.";
      const panel = root.querySelector(".lr-panel");
      if (panel && !note.parentNode) panel.appendChild(note);
    } else root.querySelector(".lr-zero-weight-error")?.remove();

    const verifierButton = [...root.querySelectorAll("button")].find(button => /Avvia simulazione|Avvia 1000 simulazioni/.test(button.textContent));
    if (verifierButton && !verifierButton.textContent.includes("Avvia 1000 simulazioni")) verifierButton.textContent = "Avvia 1000 simulazioni";
    if (root.querySelector(".lr-sim-row") && !root.querySelector(".lr-results-heading")) {
      const heading = document.createElement("h3");
      heading.className = "lr-results-heading";
      heading.textContent = "Risultati su 1000 simulazioni";
      root.querySelector(".lr-sim-head-row")?.before(heading);
    }
    const bar = root.querySelector(".lr-bar");
    if (bar && !root.querySelector(".lr-simulation-status")) {
      const status = document.createElement("div");
      status.className = "lr-status-line lr-simulation-status";
      status.textContent = "Simulazioni: 0 / 1000";
      bar.before(status);
    }
    if (bar) {
      const status = root.querySelector(".lr-simulation-status");
      if (status) {
        const text = `Simulazioni: ${Math.round((parseFloat(bar.firstElementChild?.style.width) || 0) * 10)} / 1000`;
        if (status.textContent !== text) status.textContent = text;
      }
    }
  };
  if (window.storage?.set) {
    const storageSet = window.storage.set.bind(window.storage);
    window.storage.set = (key, value, ...rest) => {
      if (key === "lottery:history") {
        try {
          const history = JSON.parse(value);
          const selector = [...document.querySelectorAll('.lr-mode-box select')].find(select => select.options.length === 1000);
          const drawSeed = normalizeLotterySeed(selector?.value);
          if (drawSeed !== null && Array.isArray(history) && history[0]?.order) {
            history[0].drawSeed = drawSeed;
            value = JSON.stringify(history);
          }
        } catch {}
      }
      return storageSet(key, value, ...rest);
    };
  }
  const observer = new MutationObserver(patchUi);
  observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  patchUi();
})();
</script>
